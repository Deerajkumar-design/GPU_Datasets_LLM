# Corrected pre-inference render of the existing Llama 3.2 3B preproduction dataset.
# This config preserves the 100-family sample from data/preproduction_llama32_3b and
# writes re-rendered/tokenized artifacts to data/preproduction_llama32_3b_v2.

name: preproduction_llama32_3b_v2
seed: 20240817
data_root: data
output_subdir: preproduction_llama32_3b_v2
schema_version: "1.1.0"
write_parquet: true

model:
  id: "meta-llama/Llama-3.2-3B-Instruct"
  max_new_tokens: 512

model_prompt:
  template_date: "09 Aug 2026"

tokenizer:
  id: "hf:meta-llama/Llama-3.2-3B-Instruct"
  fallback_id: "whitespace:v1"
  allow_fallback: false

context:
  lengths: [4096, 8192, 16384, 32768, 65536, 131072]
  target_position: 0.50
  position_tolerance: 0.05
  min_fill_ratio: 0.95

http:
  timeout_seconds: 60.0
  max_retries: 5
  backoff_seconds: 2.0
  sec_user_agent: "${SEC_USER_AGENT}"
  openfda_api_key: "${OPENFDA_API_KEY}"
  fred_api_key: "${FRED_API_KEY}"
  default_rate_limit_per_second: 5.0
  cache_enabled: true

validation:
  fail_on: ["CRITICAL"]
  numeric_recompute_rel_tolerance: 1.0e-9
  require_all_question_types: true
  max_leakage_value_rel_tolerance: 1.0e-6

domains:
  SEC:
    enabled: true
    n_families: 25
  FDA:
    enabled: true
    n_families: 25
  CLINICAL_TRIALS:
    enabled: true
    n_families: 25
  FRED:
    enabled: true
    n_families: 25

# Production configuration: the intended 500-question-family dataset.
#
# NOT YET GENERATED. This file exists so the pilot can be judged against the exact
# target it must scale to, and so scaling is a config change rather than a code change.
#
# Domain allocation: 100 families each across five domains.
# The fifth slot (EXTENSION) is intentionally unbound -- set `extension_source` to the
# chosen adapter (nasa | fred | nist | regulatory | mathematics) once decided, and
# register the corresponding adapter under Domain.EXTENSION.

name: production
seed: 20240817
data_root: data
output_subdir: production
schema_version: "1.0.0"
write_parquet: true

tokenizer:
  # Set this to the tokenizer of the model actually under test before generating.
  id: "tiktoken:cl100k_base"
  fallback_id: "whitespace:v1"
  allow_fallback: false

context:
  lengths: [4096, 8192, 16384, 32768, 65536, 131072]
  target_position: 0.50
  position_tolerance: 0.05
  min_fill_ratio: 0.95

http:
  timeout_seconds: 60.0
  max_retries: 5
  backoff_seconds: 2.0
  sec_user_agent: "${SEC_USER_AGENT}"
  sec_rate_limit_per_second: 8.0
  openfda_api_key: "${OPENFDA_API_KEY}"
  default_rate_limit_per_second: 5.0
  cache_enabled: true

validation:
  fail_on: ["CRITICAL"]
  numeric_recompute_rel_tolerance: 1.0e-9
  require_all_question_types: true
  max_leakage_value_rel_tolerance: 1.0e-6

# Global question-type target (each domain mirrors it so the totals hold):
#   DIRECT_RETRIEVAL       20%  -> 100 families
#   RETRIEVAL_CALCULATION  30%  -> 150 families
#   TEMPORAL_VERSION       15%  ->  75 families
#   ENTITY_UNIT_BINDING    15%  ->  75 families
#   UNANSWERABLE           20%  -> 100 families
domains:
  SEC:
    enabled: true
    n_families: 100
    question_type_mix:
      DIRECT_RETRIEVAL: 0.20
      RETRIEVAL_CALCULATION: 0.30
      TEMPORAL_VERSION: 0.15
      ENTITY_UNIT_BINDING: 0.15
      UNANSWERABLE: 0.20
    params:
      # Scale the entity pool with the family count: ~40 large filers give enough
      # distinct concept x period x version facts to fill 128K without reuse.
      companies:
        "0000320193": "Apple Inc."
        "0000789019": "Microsoft Corporation"
        "0001018724": "Amazon.com, Inc."
        "0000021344": "The Coca-Cola Company"
        "0000104169": "Walmart Inc."
        "0000200406": "Johnson & Johnson"
        "0000078003": "Pfizer Inc."
        "0000019617": "JPMorgan Chase & Co."
        "0000051143": "International Business Machines Corporation"
        "0000012927": "The Boeing Company"
        "0000040545": "General Electric Company"
        "0000093410": "Chevron Corporation"
        "0000034088": "Exxon Mobil Corporation"
        "0000080424": "The Procter & Gamble Company"
        "0000063908": "McDonald's Corporation"
        "0000029534": "Dollar General Corporation"
        "0000318154": "Amgen Inc."
        "0000097745": "Thermo Fisher Scientific Inc."
        "0000320187": "NIKE, Inc."
        "0001045810": "NVIDIA Corporation"

  FDA:
    enabled: true
    n_families: 100
    question_type_mix:
      DIRECT_RETRIEVAL: 0.20
      RETRIEVAL_CALCULATION: 0.30
      TEMPORAL_VERSION: 0.15
      ENTITY_UNIT_BINDING: 0.15
      UNANSWERABLE: 0.20
    params:
      limit_per_ingredient: 100
      # Broadened ingredient list; each yields dozens of applications and hundreds of
      # near-duplicate products (same ingredient, different strength/form/route/sponsor).
      ingredients:
        - "METFORMIN HYDROCHLORIDE"
        - "ATORVASTATIN CALCIUM"
        - "LISINOPRIL"
        - "AMLODIPINE BESYLATE"
        - "LEVOTHYROXINE SODIUM"
        - "OMEPRAZOLE"
        - "SERTRALINE HYDROCHLORIDE"
        - "GABAPENTIN"
        - "IBUPROFEN"
        - "AMOXICILLIN"
        - "PREDNISONE"
        - "WARFARIN SODIUM"
        - "MONTELUKAST SODIUM"
        - "LOSARTAN POTASSIUM"
        - "CIPROFLOXACIN HYDROCHLORIDE"
        - "HYDROCHLOROTHIAZIDE"
        - "SIMVASTATIN"
        - "METOPROLOL TARTRATE"
        - "FUROSEMIDE"
        - "TRAMADOL HYDROCHLORIDE"
        - "ALBUTEROL SULFATE"
        - "FLUOXETINE HYDROCHLORIDE"
        - "PANTOPRAZOLE SODIUM"
        - "ESCITALOPROM OXALATE"
        - "CLOPIDOGREL BISULFATE"

  CLINICAL_TRIALS:
    enabled: true
    n_families: 100
    question_type_mix:
      DIRECT_RETRIEVAL: 0.20
      RETRIEVAL_CALCULATION: 0.30
      TEMPORAL_VERSION: 0.15
      ENTITY_UNIT_BINDING: 0.15
      UNANSWERABLE: 0.20
    params:
      page_size: 100
      max_pages_per_query: 5
      overall_status: "COMPLETED"
      queries:
        - "metformin"
        - "atorvastatin"
        - "pembrolizumab"
        - "insulin glargine"
        - "semaglutide"
        - "rivaroxaban"
        - "aspirin"
        - "tranexamic acid"
        - "nivolumab"
        - "dapagliflozin"
        - "apixaban"
        - "sacubitril valsartan"
        - "tocilizumab"
        - "remdesivir"
        - "denosumab"
        - "ustekinumab"

  WORLD_BANK:
    enabled: true
    n_families: 100
    question_type_mix:
      DIRECT_RETRIEVAL: 0.20
      RETRIEVAL_CALCULATION: 0.30
      TEMPORAL_VERSION: 0.15
      ENTITY_UNIT_BINDING: 0.15
      UNANSWERABLE: 0.20
    params:
      date_range: "1970:2024"
      per_page: 1000
      country_batch_size: 1
      rate_limit_per_second: 2.0
      timeout_seconds: 12.0
      use_date_param: false
      # The endpoint intermittently returns a fast HTTP 502 that clears on retry.
      max_retries: 10
      backoff_seconds: 0.4
      countries:
        - USA
        - CHN
        - JPN
        - DEU
        - IND
        - GBR
        - FRA
        - BRA
        - ITA
        - CAN
        - KOR
        - MEX
        - ESP
        - IDN
        - TUR
        - NLD
        - SAU
        - CHE
        - POL
        - SWE
        - AUS
        - ARG
        - ZAF
        - NGA
        - EGY
        - THA
        - VNM
        - PHL
        - BGD
        - PAK
      indicators:
        - NY.GDP.MKTP.CD
        - NY.GDP.MKTP.KD
        - NY.GDP.PCAP.CD
        - NY.GDP.PCAP.KD
        - NY.GDP.MKTP.KD.ZG
        - SP.POP.TOTL
        - SP.POP.GROW
        - SP.URB.TOTL.IN.ZS
        - FP.CPI.TOTL.ZG
        - NE.EXP.GNFS.ZS
        - NE.IMP.GNFS.ZS
        - NE.TRD.GNFS.ZS
        - SL.UEM.TOTL.ZS
        - SP.DYN.LE00.IN
        - SP.DYN.IMRT.IN
        - SE.XPD.TOTL.GD.ZS
        - SH.XPD.CHEX.GD.ZS
        - EN.GHG.CO2.MT.CE.AR5
        - AG.LND.FRST.ZS
        - GC.DOD.TOTL.GD.ZS

  # -------------------------------------------------------------------------------
  # Fifth-domain extension slot -- 100 families. Disabled until an adapter is chosen
  # and registered under Domain.EXTENSION. Candidates, in rough order of fit:
  #
  #   fred        FRED (St. Louis Fed) economic series -- vintages give a first-class
  #               original-vs-revised axis, which is the strongest TEMPORAL_VERSION source.
  #   nasa        NASA exoplanet archive / POWER -- dense numeric, many near-duplicate
  #               measurements of the same object by different instruments.
  #   nist        NIST reference data -- units and isotopes give strong unit binding.
  #   regulatory  eCFR / Federal Register -- versioned regulation text.
  #
  # See README "How to add a new source adapter".
  # -------------------------------------------------------------------------------
  EXTENSION:
    enabled: false
    n_families: 100
    question_type_mix:
      DIRECT_RETRIEVAL: 0.20
      RETRIEVAL_CALCULATION: 0.30
      TEMPORAL_VERSION: 0.15
      ENTITY_UNIT_BINDING: 0.15
      UNANSWERABLE: 0.20
    params:
      extension_source: "UNSET"

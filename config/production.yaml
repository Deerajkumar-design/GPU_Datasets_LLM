# Production configuration: the intended 500-question-family dataset.
#
# NOT YET GENERATED. This file exists so the pilot and pre-production runs can be judged
# against the exact target they must scale to, and so scaling stays a config change
# rather than a code change.
#
# Domain allocation: 125 families each across the four ACTIVE domains.
#   SEC 125 · FDA 125 · ClinicalTrials 125 · FRED 125 = 500
#
# World Bank was REMOVED from the active experiment. Its Indicators API returned HTTP 502
# for date-range queries, hung on large result sets, and eventually refused traffic during
# the pilot. The adapter and its normalized data are retained in the repository so earlier
# datasets remain reproducible, and the domain can be revived by re-enabling it here if
# the endpoint recovers -- but nothing in the active plan depends on it.
#
# At 125 families per domain the fractional mix rounds exactly onto the design target,
# so no explicit question_type_counts override is needed here (unlike preproduction,
# where 30% of 25 is 7.5):
#   DIRECT_RETRIEVAL       100  (20%)
#   RETRIEVAL_CALCULATION  148  (30%)   <- 37 per domain
#   TEMPORAL_VERSION        76  (15%)
#   ENTITY_UNIT_BINDING     76  (15%)
#   UNANSWERABLE           100  (20%)
#
# A fifth domain can still be added later; see the EXTENSION slot at the bottom.

name: production
seed: 20240817
data_root: data
output_subdir: production
schema_version: "1.1.0"
write_parquet: true

model:
  id: "meta-llama/Llama-3.2-3B-Instruct"
  max_new_tokens: 512

model_prompt:
  template_date: "09 Aug 2026"

tokenizer:
  # Exact tokenizer for the model under test. Fallback remains disabled.
  id: "hf:meta-llama/Llama-3.2-3B-Instruct"
  fallback_id: "whitespace:v1"
  allow_fallback: false

context:
  lengths: [4096, 8192, 16384, 32768, 65536, 131072]
  target_position: 0.50
  position_tolerance: 0.05
  min_fill_ratio: 0.95

http:
  timeout_seconds: 60.0
  max_retries: 5
  backoff_seconds: 2.0
  sec_user_agent: "${SEC_USER_AGENT}"
  sec_rate_limit_per_second: 8.0
  openfda_api_key: "${OPENFDA_API_KEY}"
  # Optional. Without it the FRED adapter uses the keyless first-party
  # St. Louis Fed CSV endpoints and marks series attributes operator-supplied.
  fred_api_key: "${FRED_API_KEY}"
  default_rate_limit_per_second: 5.0
  cache_enabled: true

validation:
  fail_on: ["CRITICAL"]
  numeric_recompute_rel_tolerance: 1.0e-9
  require_all_question_types: true
  max_leakage_value_rel_tolerance: 1.0e-6

domains:
  SEC:
    enabled: true
    n_families: 125
    question_type_mix:
      DIRECT_RETRIEVAL: 0.20
      RETRIEVAL_CALCULATION: 0.30
      TEMPORAL_VERSION: 0.15
      ENTITY_UNIT_BINDING: 0.15
      UNANSWERABLE: 0.20
    params:
      # Scale the entity pool with the family count: ~40 large filers give enough
      # distinct concept x period x version facts to fill 128K without reuse.
      companies:
        "0000320193": "Apple Inc."
        "0000789019": "Microsoft Corporation"
        "0001018724": "Amazon.com, Inc."
        "0000021344": "The Coca-Cola Company"
        "0000104169": "Walmart Inc."
        "0000200406": "Johnson & Johnson"
        "0000078003": "Pfizer Inc."
        "0000019617": "JPMorgan Chase & Co."
        "0000051143": "International Business Machines Corporation"
        "0000012927": "The Boeing Company"
        "0000040545": "General Electric Company"
        "0000093410": "Chevron Corporation"
        "0000034088": "Exxon Mobil Corporation"
        "0000080424": "The Procter & Gamble Company"
        "0000063908": "McDonald's Corporation"
        "0000029534": "Dollar General Corporation"
        "0000318154": "Amgen Inc."
        "0000097745": "Thermo Fisher Scientific Inc."
        "0000320187": "NIKE, Inc."
        "0001045810": "NVIDIA Corporation"

  FDA:
    enabled: true
    n_families: 125
    question_type_mix:
      DIRECT_RETRIEVAL: 0.20
      RETRIEVAL_CALCULATION: 0.30
      TEMPORAL_VERSION: 0.15
      ENTITY_UNIT_BINDING: 0.15
      UNANSWERABLE: 0.20
    params:
      limit_per_ingredient: 100
      # Broadened ingredient list; each yields dozens of applications and hundreds of
      # near-duplicate products (same ingredient, different strength/form/route/sponsor).
      ingredients:
        - "METFORMIN HYDROCHLORIDE"
        - "ATORVASTATIN CALCIUM"
        - "LISINOPRIL"
        - "AMLODIPINE BESYLATE"
        - "LEVOTHYROXINE SODIUM"
        - "OMEPRAZOLE"
        - "SERTRALINE HYDROCHLORIDE"
        - "GABAPENTIN"
        - "IBUPROFEN"
        - "AMOXICILLIN"
        - "PREDNISONE"
        - "WARFARIN SODIUM"
        - "MONTELUKAST SODIUM"
        - "LOSARTAN POTASSIUM"
        - "CIPROFLOXACIN HYDROCHLORIDE"
        - "HYDROCHLOROTHIAZIDE"
        - "SIMVASTATIN"
        - "METOPROLOL TARTRATE"
        - "FUROSEMIDE"
        - "TRAMADOL HYDROCHLORIDE"
        - "ALBUTEROL SULFATE"
        - "FLUOXETINE HYDROCHLORIDE"
        - "PANTOPRAZOLE SODIUM"
        - "ESCITALOPROM OXALATE"
        - "CLOPIDOGREL BISULFATE"

  CLINICAL_TRIALS:
    enabled: true
    n_families: 125
    question_type_mix:
      DIRECT_RETRIEVAL: 0.20
      RETRIEVAL_CALCULATION: 0.30
      TEMPORAL_VERSION: 0.15
      ENTITY_UNIT_BINDING: 0.15
      UNANSWERABLE: 0.20
    params:
      page_size: 100
      max_pages_per_query: 5
      overall_status: "COMPLETED"
      queries:
        - "metformin"
        - "atorvastatin"
        - "pembrolizumab"
        - "insulin glargine"
        - "semaglutide"
        - "rivaroxaban"
        - "aspirin"
        - "tranexamic acid"
        - "nivolumab"
        - "dapagliflozin"
        - "apixaban"
        - "sacubitril valsartan"
        - "tocilizumab"
        - "remdesivir"
        - "denosumab"
        - "ustekinumab"


  FRED:
    enabled: true
    n_families: 125
    question_type_mix:
      DIRECT_RETRIEVAL: 0.20
      RETRIEVAL_CALCULATION: 0.30
      TEMPORAL_VERSION: 0.15
      ENTITY_UNIT_BINDING: 0.15
      UNANSWERABLE: 0.20
    params:
      observation_start: '1990-01-01'
      rate_limit_per_second: 4.0
      vintage_series:
      - GDP
      - GDPC1
      - PAYEMS
      - UNRATE
      - CPIAUCSL
      vintage_dates:
      - '2021-04-29'
      - '2021-07-29'
      - '2022-06-29'
      - '2023-09-28'
      - '2025-03-27'
      vintage_observation_start: '2018-01-01'
      series:
      - id: UNRATE
        title: Unemployment Rate
        units: Percent
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted
        family: unemployment_rate
        geo_code: US
        geo_name: United States
      - id: UNRATENSA
        title: Unemployment Rate
        units: Percent
        frequency: Monthly
        seasonal_adjustment: Not Seasonally Adjusted
        family: unemployment_rate
        geo_code: US
        geo_name: United States
      - id: CPIAUCSL
        title: 'Consumer Price Index for All Urban Consumers: All Items in U.S. City Average'
        units: Index 1982-1984=100
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted
        family: cpi_all_items
        geo_code: US
        geo_name: United States
      - id: CPIAUCNS
        title: 'Consumer Price Index for All Urban Consumers: All Items in U.S. City Average'
        units: Index 1982-1984=100
        frequency: Monthly
        seasonal_adjustment: Not Seasonally Adjusted
        family: cpi_all_items
        geo_code: US
        geo_name: United States
      - id: PAYEMS
        title: All Employees, Total Nonfarm
        units: Thousands of Persons
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted
        family: nonfarm_payrolls
        geo_code: US
        geo_name: United States
      - id: PAYNSA
        title: All Employees, Total Nonfarm
        units: Thousands of Persons
        frequency: Monthly
        seasonal_adjustment: Not Seasonally Adjusted
        family: nonfarm_payrolls
        geo_code: US
        geo_name: United States
      - id: HOUST
        title: 'New Privately-Owned Housing Units Started: Total Units'
        units: Thousands of Units
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted Annual Rate
        family: housing_starts
        geo_code: US
        geo_name: United States
      - id: HOUSTNSA
        title: 'New Privately-Owned Housing Units Started: Total Units'
        units: Thousands of Units
        frequency: Monthly
        seasonal_adjustment: Not Seasonally Adjusted
        family: housing_starts
        geo_code: US
        geo_name: United States
      - id: GDP
        title: Gross Domestic Product
        units: Billions of Dollars
        frequency: Quarterly
        seasonal_adjustment: Seasonally Adjusted Annual Rate
        family: gross_domestic_product
        geo_code: US
        geo_name: United States
      - id: GDPC1
        title: Gross Domestic Product
        units: Billions of Chained 2017 Dollars
        frequency: Quarterly
        seasonal_adjustment: Seasonally Adjusted Annual Rate
        family: gross_domestic_product
        geo_code: US
        geo_name: United States
      - id: PCE
        title: Personal Consumption Expenditures
        units: Billions of Dollars
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted Annual Rate
        family: personal_consumption
        geo_code: US
        geo_name: United States
      - id: PCEC96
        title: Personal Consumption Expenditures
        units: Billions of Chained 2017 Dollars
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted Annual Rate
        family: personal_consumption
        geo_code: US
        geo_name: United States
      - id: DGS10
        title: Market Yield on U.S. Treasury Securities at 10-Year Constant Maturity
        units: Percent
        frequency: Daily
        seasonal_adjustment: Not Seasonally Adjusted
        family: treasury_10y
        geo_code: US
        geo_name: United States
      - id: WGS10YR
        title: Market Yield on U.S. Treasury Securities at 10-Year Constant Maturity
        units: Percent
        frequency: Weekly
        seasonal_adjustment: Not Seasonally Adjusted
        family: treasury_10y
        geo_code: US
        geo_name: United States
      - id: GS10
        title: Market Yield on U.S. Treasury Securities at 10-Year Constant Maturity
        units: Percent
        frequency: Monthly
        seasonal_adjustment: Not Seasonally Adjusted
        family: treasury_10y
        geo_code: US
        geo_name: United States
      - id: CAUR
        title: Unemployment Rate
        units: Percent
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted
        family: unemployment_rate
        geo_code: CA
        geo_name: California
      - id: TXUR
        title: Unemployment Rate
        units: Percent
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted
        family: unemployment_rate
        geo_code: TX
        geo_name: Texas
      - id: NYUR
        title: Unemployment Rate
        units: Percent
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted
        family: unemployment_rate
        geo_code: NY
        geo_name: New York
      - id: FLUR
        title: Unemployment Rate
        units: Percent
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted
        family: unemployment_rate
        geo_code: FL
        geo_name: Florida
      - id: ILUR
        title: Unemployment Rate
        units: Percent
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted
        family: unemployment_rate
        geo_code: IL
        geo_name: Illinois
      - id: PAUR
        title: Unemployment Rate
        units: Percent
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted
        family: unemployment_rate
        geo_code: PA
        geo_name: Pennsylvania
      - id: FEDFUNDS
        title: Federal Funds Effective Rate
        units: Percent
        frequency: Monthly
        seasonal_adjustment: Not Seasonally Adjusted
        family: fed_funds_rate
        geo_code: US
        geo_name: United States
      - id: INDPRO
        title: 'Industrial Production: Total Index'
        units: Index 2017=100
        frequency: Monthly
        seasonal_adjustment: Seasonally Adjusted
        family: industrial_production
        geo_code: US
        geo_name: United States
      # For 125 FRED families, widen `vintage_series` and `vintage_dates` before running:
      # vintages are what supply authentic WRONG_VERSION interference, and only genuinely
      # revised series should be added. Do not add vintages for market rates such as
      # DGS10, which are never revised -- that would pad the counts without adding any
      # real conflict.

  # -------------------------------------------------------------------------------
  # Fifth-domain extension slot -- retained so a fifth source can be added without
  # restructuring anything. Disabled until an adapter is registered under
  # Domain.EXTENSION. Candidates, in rough order of fit:
  #
  #   nasa        NASA exoplanet archive / POWER -- dense numeric, many near-duplicate
  #               measurements of the same object by different instruments.
  #   nist        NIST reference data -- units and isotopes give strong unit binding.
  #   regulatory  eCFR / Federal Register -- versioned regulation text.
  #   mathematics deterministic generated problems -- unlimited scale, no API risk.
  #
  # FRED is no longer a candidate here: it was promoted to a first-class active domain.
  # See README "How to add a new source adapter".
  # -------------------------------------------------------------------------------
  EXTENSION:
    enabled: false
    n_families: 0
    question_type_mix:
      DIRECT_RETRIEVAL: 0.20
      RETRIEVAL_CALCULATION: 0.30
      TEMPORAL_VERSION: 0.15
      ENTITY_UNIT_BINDING: 0.15
      UNANSWERABLE: 0.20
    params:
      extension_source: "UNSET"

# Pre-production configuration: 100 question families across the four ACTIVE domains.
#
# NOT YET GENERATED. This file is prepared and validated only; generating it is a
# separate, explicit step (see README "Scaling").
#
# World Bank is deliberately absent. Its Indicators API returned HTTP 502 for date-range
# queries, hung on large result sets, and eventually refused traffic outright during the
# pilot. The adapter and its data are retained in the repository so earlier datasets stay
# reproducible, but the domain is not part of the active experiment.
#
# Question-type totals land EXACTLY on the design target:
#   DIRECT_RETRIEVAL       20   (20%)
#   RETRIEVAL_CALCULATION  30   (30%)
#   TEMPORAL_VERSION       15   (15%)
#   ENTITY_UNIT_BINDING    15   (15%)
#   UNANSWERABLE           20   (20%)
# Explicit `question_type_counts` are used rather than fractions because 30% of 25 is
# 7.5: no per-domain rounding of the fractional mix can hit the global target, so the
# counts are stated per domain and chosen to sum correctly.

name: preproduction
seed: 20240817
data_root: data
output_subdir: preproduction
schema_version: "1.1.0"
write_parquet: true

tokenizer:
  # >>> SET THIS BEFORE GENERATING <<<
  # Token counts are the independent variable of the experiment, so this must match the
  # tokenizer of the model actually under test. Changing this one field and re-running
  # `build-contexts` is the whole switch -- no code change. See
  # data/reports/preproduction_readiness.md section "Tokenizer readiness".
  id: "tiktoken:cl100k_base"
  fallback_id: "whitespace:v1"
  allow_fallback: false

context:
  lengths: [4096, 8192, 16384, 32768, 65536, 131072]
  target_position: 0.50
  position_tolerance: 0.05
  min_fill_ratio: 0.95

http:
  timeout_seconds: 60.0
  max_retries: 5
  backoff_seconds: 2.0
  sec_user_agent: "${SEC_USER_AGENT}"
  openfda_api_key: "${OPENFDA_API_KEY}"
  fred_api_key: "${FRED_API_KEY}"
  default_rate_limit_per_second: 5.0
  cache_enabled: true

validation:
  fail_on: ["CRITICAL"]
  numeric_recompute_rel_tolerance: 1.0e-9
  require_all_question_types: true
  max_leakage_value_rel_tolerance: 1.0e-6

domains:
  SEC:
    enabled: true
    n_families: 25
    # Entity pool widened below; 25 families need distinct filers to avoid repetition.
    question_type_counts:
      DIRECT_RETRIEVAL: 5
      RETRIEVAL_CALCULATION: 8
      TEMPORAL_VERSION: 4
      ENTITY_UNIT_BINDING: 3
      UNANSWERABLE: 5
    params:
      companies:
        0000320193: Apple Inc.
        0000789019: Microsoft Corporation
        0001018724: Amazon.com, Inc.
        '0000021344': The Coca-Cola Company
        0000104169: Walmart Inc.
        '0000200406': Johnson & Johnson
        0000078003: Pfizer Inc.
        0000019617: JPMorgan Chase & Co.
        '0000051143': International Business Machines Corporation
        0000012927: The Boeing Company
        '0000040545': General Electric Company
        0000093410: Chevron Corporation
        0000034088: Exxon Mobil Corporation
        0000080424: The Procter & Gamble Company
        0000063908: McDonald's Corporation
        0000029534: Dollar General Corporation
        0000318154: Amgen Inc.
        0000097745: Thermo Fisher Scientific Inc.
        0000320187: NIKE, Inc.
        0001045810: NVIDIA Corporation


  FDA:
    enabled: true
    n_families: 25
    # Ingredient list drives application/product breadth.
    question_type_counts:
      DIRECT_RETRIEVAL: 5
      RETRIEVAL_CALCULATION: 8
      TEMPORAL_VERSION: 3
      ENTITY_UNIT_BINDING: 4
      UNANSWERABLE: 5
    params:
      limit_per_ingredient: 100
      ingredients:
      - METFORMIN HYDROCHLORIDE
      - ATORVASTATIN CALCIUM
      - LISINOPRIL
      - AMLODIPINE BESYLATE
      - LEVOTHYROXINE SODIUM
      - OMEPRAZOLE
      - SERTRALINE HYDROCHLORIDE
      - GABAPENTIN
      - IBUPROFEN
      - AMOXICILLIN
      - PREDNISONE
      - WARFARIN SODIUM
      - MONTELUKAST SODIUM
      - LOSARTAN POTASSIUM
      - CIPROFLOXACIN HYDROCHLORIDE
      - HYDROCHLOROTHIAZIDE
      - SIMVASTATIN
      - METOPROLOL TARTRATE
      - FUROSEMIDE
      - TRAMADOL HYDROCHLORIDE
      - ALBUTEROL SULFATE
      - FLUOXETINE HYDROCHLORIDE
      - PANTOPRAZOLE SODIUM
      - ESCITALOPROM OXALATE
      - CLOPIDOGREL BISULFATE


  CLINICAL_TRIALS:
    enabled: true
    n_families: 25
    # Query list drives trial breadth.
    question_type_counts:
      DIRECT_RETRIEVAL: 5
      RETRIEVAL_CALCULATION: 7
      TEMPORAL_VERSION: 4
      ENTITY_UNIT_BINDING: 4
      UNANSWERABLE: 5
    params:
      page_size: 100
      max_pages_per_query: 5
      overall_status: COMPLETED
      queries:
      - metformin
      - atorvastatin
      - pembrolizumab
      - insulin glargine
      - semaglutide
      - rivaroxaban
      - aspirin
      - tranexamic acid
      - nivolumab
      - dapagliflozin
      - apixaban
      - sacubitril valsartan
      - tocilizumab
      - remdesivir
      - denosumab
      - ustekinumab


  FRED:
    enabled: true
    n_families: 25
    # Vintage series/dates are what make TEMPORAL_VERSION and WRONG_VERSION real here.
    question_type_counts:
      DIRECT_RETRIEVAL: 5
      RETRIEVAL_CALCULATION: 7
      TEMPORAL_VERSION: 4
      ENTITY_UNIT_BINDING: 4
      UNANSWERABLE: 5
    params:
      observation_start: '1990-01-01'
      rate_limit_per_second: 4.0
      vintage_series:
      - GDP
      - GDPC1
      - PAYEMS
      - UNRATE
      - CPIAUCSL
      vintage_dates:
